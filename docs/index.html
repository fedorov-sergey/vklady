<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выбор вклада — сравнение ставок</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div>
    <h1>Выбор вклада</h1>
    <p class="subtitle" id="meta-info">Загрузка данных…</p>
  </div>
  <div class="header-stat" id="header-stat"></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button id="filters-toggle" class="filters-toggle" aria-expanded="false">Фильтры</button>
    <div id="filters" class="filters" hidden>
      <div class="filter-group">
        <label for="f-amount">Сумма, ₽</label>
        <input id="f-amount" type="number" step="100000" min="0">
      </div>
      <div class="filter-group">
        <label for="f-term">Срок</label>
        <select id="f-term"><option value="">Любой</option></select>
      </div>
      <div class="filter-group">
        <label for="f-pop">Пополнение</label>
        <select id="f-pop">
          <option value="">Не важно</option>
          <option value="да">С пополнением</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="f-sny">Снятие</label>
        <select id="f-sny">
          <option value="">Не важно</option>
          <option value="да">Со снятием</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="f-spend">Траты в месяц</label>
        <select id="f-spend"><option value="">Не важно</option></select>
      </div>
      <div class="filter-group">
        <label for="f-sub">Подписка</label>
        <select id="f-sub"><option value="">Не важно</option></select>
      </div>
      <div class="filter-group toggle-group">
        <label><input id="f-newmoney" type="checkbox" checked> Все деньги новые</label>
      </div>
      <div class="sidebar-note" id="sidebar-note"></div>
    </div>
  </aside>

  <main class="content">
    <div class="content-top">
      <div class="segments" id="segment-type">
        <button class="segment active" data-type="all">Все</button>
        <button class="segment" data-type="вклад">Вклады</button>
        <button class="segment" data-type="счет">Счета</button>
      </div>
      <div class="view-switch" id="view-switch">
        <button class="segment active" data-view="grouped">По продуктам</button>
        <button class="segment" data-view="scenario">По сценариям</button>
      </div>
      <span id="count" class="count"></span>
    </div>

    <div class="sort-bar">
      <span class="sort-label">Сортировка</span>
      <button class="sort-btn active" data-sort="rate">Ставка</button>
      <button class="sort-btn" data-sort="income">Доход</button>
      <button class="sort-btn" data-sort="duration">Срок</button>
      <button class="sort-btn" data-sort="bank">Банк</button>
      <span class="sort-arrow" id="sort-arrow">&#9660;</span>
    </div>

    <div id="cards" class="cards-grid"></div>
  </main>
</div>

<footer>
  <p>Данные носят справочный характер. Перед принятием решения уточняйте условия в банке.</p>
  <p id="footer-meta"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
