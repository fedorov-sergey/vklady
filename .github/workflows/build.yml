name: build

# Пересбирает docs/data.json из Вклады.xlsx и коммитит результат.
# Работает при пуше, затрагивающем Вклады.xlsx или build.py.
on:
  push:
    branches: [ master ]
    paths:
      - 'Вклады.xlsx'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install openpyxl

      - name: Build data.json
        run: python build.py

      - name: Commit changes
        run: |
          if ! git diff --quiet docs/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data.json
            git commit -m "data: автосборка из Вклады.xlsx"
            git push
          else
            echo "data.json не изменился — коммит не нужен"
          fi